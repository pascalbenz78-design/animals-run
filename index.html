<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4a9be8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Animals Run" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
    <title>Animals Run</title>
  </head>
  <body>
    <div id="game"></div>

    <div id="ui">
      <!-- Titelbild -->
      <section id="scr-title" class="screen">
        <div class="logo"><span class="logo-a">Animals</span><span class="logo-b">Run</span></div>
        <p class="blink" data-t="tapToStart"></p>
      </section>

      <!-- Intro -->
      <section id="scr-intro" class="screen hidden intro">
        <div id="intro-card" class="intro-card hidden">
          <div class="ic-name" id="intro-name"></div>
          <div class="ic-species" id="intro-species"></div>
          <div class="ic-power" id="intro-power"></div>
          <div class="ic-desc" id="intro-desc"></div>
        </div>
        <div id="intro-logo" class="logo hidden"><span class="logo-a">Animals</span><span class="logo-b">Run</span></div>
        <p id="intro-go" class="intro-go hidden" data-t="intro.go"></p>
        <button class="btn intro-skip" id="btn-intro-skip" data-t="intro.skip"></button>
      </section>

      <!-- Hauptmenü -->
      <section id="scr-main" class="screen hidden">
        <div class="logo small"><span class="logo-a">Animals</span><span class="logo-b">Run</span></div>
        <div class="menu-col">
          <button class="btn big" id="btn-single" data-t="menu.single"></button>
          <button class="btn big cup" id="btn-cup" data-t="menu.cup"></button>
          <button class="btn big mp" data-go="mp" data-t="menu.mp"></button>
          <button class="btn" data-go="options" data-t="menu.options"></button>
          <button class="btn" data-go="help" data-t="menu.help"></button>
          <button class="btn" data-go="controls" data-t="menu.controls"></button>
        </div>
        <button class="btn icon fs-btn" title="Vollbild">⛶</button>
      </section>

      <!-- Tierwahl -->
      <section id="scr-animal" class="screen hidden">
        <h2 data-t="menu.chooseAnimal"></h2>
        <div class="pick">
          <div class="preview-box"><canvas id="preview"></canvas></div>
          <div class="pick-right">
            <div id="animal-grid" class="animal-grid"></div>
            <div id="animal-info" class="panel info"></div>
          </div>
        </div>
        <div class="row">
          <button class="btn" data-go="main" data-t="menu.back"></button>
          <button class="btn primary" data-go="track" data-t="menu.next"></button>
        </div>
      </section>

      <!-- Streckenwahl -->
      <section id="scr-track" class="screen hidden">
        <h2 id="track-title" data-t="menu.chooseTrack"></h2>
        <div id="track-cards" class="cards"></div>
        <div class="row center">
          <span data-t="menu.difficulty"></span>
          <div id="difficulty" class="seg"></div>
        </div>
        <div class="row">
          <button class="btn" data-go="animal" data-t="menu.back"></button>
          <button class="btn primary" id="btn-start" data-t="menu.start"></button>
        </div>
      </section>

      <!-- Optionen -->
      <section id="scr-options" class="screen hidden">
        <h2 data-t="options.title"></h2>
        <div class="panel">
          <div class="opt"><span data-t="options.quality"></span><div id="opt-quality" class="seg"></div></div>
          <div class="opt"><span data-t="options.autoRun"></span><div id="opt-autorun" class="seg"></div></div>
          <div class="opt"><span data-t="options.controlHints"></span><div id="opt-hints" class="seg"></div></div>
          <div class="opt"><span data-t="options.steer"></span><div id="opt-steer" class="seg"></div></div>
          <div class="opt"><span data-t="options.musicVol"></span><input type="range" id="opt-music" min="0" max="100" /></div>
          <div class="opt"><span data-t="options.sfxVol"></span><input type="range" id="opt-sfx" min="0" max="100" /></div>
          <div class="opt"><span data-t="options.mute"></span><div id="opt-mute" class="seg"></div></div>
          <div class="opt"><span data-t="options.intro"></span><div id="opt-intro" class="seg"></div></div>
        </div>
        <button class="btn" id="btn-options-back" data-t="menu.back"></button>
      </section>

      <!-- Steuerung -->
      <section id="scr-controls" class="screen hidden">
        <h2 data-t="controls.title"></h2>
        <div class="panel"><table id="controls-table"></table><p class="note" data-t="controls.hint"></p></div>
        <button class="btn" data-go="main" data-t="menu.back"></button>
      </section>

      <!-- Mehrspieler: erstellen oder beitreten -->
      <section id="scr-mp" class="screen hidden">
        <h2 data-t="mp.title"></h2>
        <div class="panel mp-panel">
          <label class="mp-label" for="mp-name" data-t="mp.yourName"></label>
          <input id="mp-name" class="mp-input" maxlength="14" autocomplete="off" />
          <div class="mp-cols">
            <div class="mp-col">
              <button class="btn primary" id="btn-mp-create" data-t="mp.create"></button>
              <p class="note" data-t="mp.createHint"></p>
            </div>
            <div class="mp-col">
              <input id="mp-code" class="mp-input code" maxlength="4" autocomplete="off" autocapitalize="characters" />
              <button class="btn" id="btn-mp-join" data-t="mp.join"></button>
            </div>
          </div>
          <p id="mp-status" class="mp-status"></p>
          <p class="note" data-t="mp.mobileHint"></p>
        </div>
        <button class="btn" data-go="main" data-t="menu.back"></button>
      </section>

      <!-- Lobby -->
      <section id="scr-lobby" class="screen hidden">
        <div class="code-box"><span data-t="mp.code"></span> <b id="lobby-code"></b><small data-t="mp.shareHint"></small></div>
        <div class="lobby-row">
          <div class="panel lobby-players"><h3 data-t="mp.players"></h3><table id="lobby-players"></table><p class="note" data-t="mp.fill"></p></div>
          <div class="panel lobby-settings" id="lobby-settings"></div>
        </div>
        <div class="row">
          <button class="btn" id="btn-lobby-leave" data-t="mp.leave"></button>
          <button class="btn" id="btn-lobby-animal" data-t="mp.pickAnimal"></button>
          <button class="btn primary" id="btn-lobby-ready"></button>
        </div>
        <p id="lobby-status" class="lobby-status"></p>
      </section>

      <!-- Hilfe -->
      <section id="scr-help" class="screen hidden">
        <h2 data-t="help.title"></h2>
        <div id="help-tabs" class="seg"></div>
        <div id="help-body" class="panel help"></div>
        <button class="btn" data-go="main" data-t="menu.back"></button>
      </section>

      <!-- Laden -->
      <section id="scr-loading" class="screen hidden">
        <div class="loading-card">
          <div id="loading-name" class="loading-name"></div>
          <div id="loading-sub"></div>
          <p id="loading-tip" class="loading-tip"></p>
          <p id="loading-busy" class="blink" data-t="loading"></p>
          <button class="btn primary hidden" id="btn-loading-go" data-t="menu.start"></button>
          <p id="loading-wait" class="note hidden" data-t="loadingWait"></p>
        </div>
      </section>

      <!-- Rennen: HUD -->
      <section id="hud" class="hidden">
        <div id="speedlines"></div>
        <div class="hud-tl">
          <div class="place"><span id="hud-place">1.</span><small>/8</small></div>
          <div class="hud-box">
            <div><span data-t="hud.lap"></span> <b id="hud-lap">1/3</b></div>
            <div id="hud-time" class="mono">0:00.00</div>
          </div>
        </div>
        <div class="hud-energy">
          <span class="bolt-ico">⚡</span>
          <div class="bar"><div id="hud-energy-fill"></div></div>
        </div>
        <div id="netinfo" class="netinfo hidden"></div>
        <div id="hud-power" class="hud-power">
          <span id="hud-power-ico" class="ico">🥕</span>
          <span id="hud-power-slots" class="slots"><i></i><i></i><i></i></span>
          <span id="hud-power-key" class="key">E</span>
        </div>
        <div id="itempop"></div>
        <canvas id="minimap" width="180" height="180"></canvas>
        <button id="btn-pause" class="btn icon pause-btn" aria-label="Pause">❚❚</button>
        <div id="countdown"></div>
        <div id="toast"></div>
        <div id="lapinfo"></div>
        <div id="warn"></div>
        <div id="touch" class="hidden">
          <div class="tleft">
            <div class="tstick" id="t-stick"><span class="tarrow l">◀</span><span class="tarrow r">▶</span><div class="tknob" id="t-knob"></div></div>
            <button class="tbtn" id="t-left">◀</button>
            <button class="tbtn" id="t-right">▶</button>
          </div>
          <div class="tright">
            <button class="tbtn small" id="t-power" data-t="hud.power"></button>
            <button class="tbtn small" id="t-jump" data-t="hud.jump"></button>
            <button class="tbtn run" id="t-run" data-t="hud.run"></button>
          </div>
        </div>
        <div id="key-hints" class="hidden">W/↑ Lauf · S/↓ Bremsen (Auto-Lauf) · A/D ◀ ▶ Lenken · Leertaste Sprung · E Superkraft · Esc Pause</div>
      </section>

      <!-- Pause -->
      <section id="scr-pause" class="screen dim hidden">
        <h2 data-t="pause.title"></h2>
        <div class="menu-col">
          <button class="btn big" id="btn-resume" data-t="pause.resume"></button>
          <button class="btn" id="btn-restart" data-t="pause.restart"></button>
          <button class="btn" id="btn-pause-options" data-t="pause.options"></button>
          <button class="btn" id="btn-quit" data-t="pause.toMenu"></button>
        </div>
      </section>

      <!-- Ergebnis -->
      <section id="scr-results" class="screen dim hidden">
        <h2 id="results-title" data-t="results.title"></h2>
        <div id="record" class="record hidden" data-t="results.newRecord"></div>
        <p id="results-wait" class="lobby-status hidden" data-t="mp.waitHost"></p>
        <div class="results-row">
          <div class="panel"><table id="results-table"></table></div>
          <div id="cup-box" class="panel hidden"><h3 data-t="cup.standings"></h3><table id="cup-table"></table></div>
        </div>
        <div class="row">
          <button class="btn" id="btn-results-menu" data-t="results.menu"></button>
          <button class="btn primary" id="btn-again" data-t="results.again"></button>
          <button class="btn primary hidden" id="btn-next" data-t="cup.next"></button>
        </div>
      </section>

      <!-- Siegerehrung -->
      <section id="scr-ceremony" class="screen hidden ceremony">
        <h2 id="ceremony-title" data-t="cup.title"></h2>
        <div id="ceremony-you" class="record"></div>
        <div class="panel ceremony-panel"><h3 data-t="cup.final"></h3><table id="ceremony-table"></table></div>
        <button class="btn primary" id="btn-ceremony-menu" data-t="results.menu"></button>
      </section>

      <div id="notice"></div>
      <div id="rotate"><div>📱↻</div><p data-t="rotate"></p></div>
      <div id="fps" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
